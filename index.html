<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-portfolio simplified.org</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    
  </head>
  <body>
    <section id="landing container">
      <div class="row">
        <nav>
          <div class="logo__name">
            <h2 class="name">jonathan.wandag</h2>
          </div>
          <div class="menu__icons">
            <img src="assets/icons/techstack.svg"  alt="Tech Stack" />
            <img src="assets/icons/email.svg"  alt="Email" />
            <img src="assets/icons/projects.svg"  alt="Projects" />
            <img src="assets/icons/github.svg"  alt="GitHub" />
            <img src="assets/icons/linkedin.svg"  alt="LinkedIn" />            
          </div>
        </nav>
        <div class="hero">
          <div class="hero__left">
            <h1 class="hero__greeting">Hello There!</h1>
            <h1 class="hero__greeting">I'm Jonathan Wandag.</h1>
            <p class="hero__about">Based in the US, I'm a fullstack developer, hyper-enthusastic about building accessible web apps that users enjoy</p>
            <p class="hero__contact-me"><b>CONTACT ME</b></p>
          </div>
        </div>
      </div>
    </section>

  </body>
</html>
